# Chuẩn bị cho Bước 5. Chưa triển khai hoặc kết nối tài khoản Render.
# Cả hai lệnh build chạy từ thư mục gốc repository.
services:
  - type: web
    name: tlinhgame-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: tlinhgame-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
